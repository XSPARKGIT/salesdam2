# Render Blueprint — API (Docker) + SPA (static).
#
# The URLs below assume Render keeps the service names as their subdomains
# (salesdam-api.onrender.com, salesdam-web.onrender.com). If Render assigns a
# suffixed URL (e.g. salesdam-api-x1y2.onrender.com), update the /api rewrite,
# CORS_ORIGINS and APP_URL to match.
#
# Database: the backend uses MongoDB (mongoose). Render's `databases:` only
# provisions Postgres, so there is no database here — create a MongoDB Atlas
# cluster and paste its connection string as MONGO_URI when Render prompts.

services:
  - type: web
    name: salesdam-api
    runtime: docker
    repo: https://github.com/SaphoM/Salesdam-v3
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # secret: MongoDB Atlas connection string, entered in the dashboard
      - key: SESSION_MAX_AGE
        value: 86400000
      # Browsers reach the API through the SPA's /api rewrite (same origin),
      # but allow the SPA origin explicitly for any direct cross-origin call.
      - key: CORS_ORIGINS
        value: https://salesdam-web.onrender.com
      # Base URL for links in emails and notifications.
      - key: APP_URL
        value: https://salesdam-web.onrender.com
    region: oregon

  - type: web
    name: salesdam-web
    runtime: static
    repo: https://github.com/SaphoM/Salesdam-v3
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    # Build-time flags (Vite inlines VITE_* when the bundle is built). VITE_API_URL
    # is deliberately unset: the SPA calls same-origin /api/v1, which the rewrite
    # below proxies to the API — so the session cookie stays first-party.
    envVars:
      - key: VITE_FEATURE_DASHBOARDS
        value: 'true'
      - key: VITE_FEATURE_AUTOMATION
        value: 'true'
      # Email templates/senders, PDF templates and integrations stay off, as in
      # frontend/.env.example; add VITE_FEATURE_<NAME>: 'true' to enable one.
    # Order matters: the /api proxy must come before the SPA catch-all.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://salesdam-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    region: oregon
