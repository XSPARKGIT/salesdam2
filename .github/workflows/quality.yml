name: Quality gates

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        # A replica set is required: the merge/approval/tenant-isolation suites
        # use Mongo transactions, which a standalone mongod rejects.
        command: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/salesdam_ci?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Initiate the Mongo replica set
        run: >
          docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval
          "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          && for i in $(seq 1 30); do
          mongosh --quiet --eval "db.hello().isWritablePrimary" && break || sleep 2;
          done
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend unit tests
        working-directory: backend
        run: npm test
      - name: Run database-backed integration tests
        working-directory: backend
        run: |
          node tests/tenant-isolation.e2e.mjs
          node tests/admin-guards.e2e.mjs
          node tests/password-reset.e2e.mjs
          node tests/configuration.e2e.mjs
          node tests/approval-process.e2e.mjs
          node tests/duplicate-detection.e2e.mjs
          node tests/consent.e2e.mjs
          node tests/activity.e2e.mjs
          node tests/change-set.e2e.mjs
          node tests/omnichannel.e2e.mjs
          node tests/telephony.e2e.mjs
          node tests/record-merge.e2e.mjs
          node tests/conversation-capture.e2e.mjs
          node tests/insurance-endorsements.e2e.mjs
          node tests/insurance-scheduler.e2e.mjs
      - name: Run insurance domain suites
        working-directory: backend
        run: npm run test:insurance

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci
      - name: Build admin
        working-directory: admin
        run: npm run build